name: Fab Plugin Builds

on:
  push:
    tags:
      - "release/*"
  workflow_dispatch:

# Need write access to repository contents to create releases and upload assets.
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: powershell
    env:
      PLUGIN_DIR: "Plugins/VMCLiveLink"
      VRM_PLUGIN_DIR: "Plugins/VRMInterchange"
      # The supported engines, oldest first, in the same order in both lists. The runner has each
      # at C:\Program Files\Epic Games\UE_<version>.
      ENGINE_ROOTS: 'C:\Program Files\Epic Games\UE_5.6,C:\Program Files\Epic Games\UE_5.7,C:\Program Files\Epic Games\UE_5.8'
      ENGINE_VERSIONS: '5.6.0,5.7.0,5.8.0'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true
          
      - name: Set PowerShell Execution Policy
        run: Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
        shell: powershell
        
      - name: Git LFS pull
        run: |
          git lfs install
          git lfs fetch --all
          git lfs pull

      - name: Ensure scripts exist
        run: |
          if (-not (Test-Path "scripts\build_fab.ps1")) {
            Write-Error "scripts/build_fab.ps1 not found. Commit the script to scripts/build_fab.ps1 or update the workflow path."
          }
          if (-not (Test-Path "scripts\verify_copyright_headers.ps1")) {
            Write-Error "scripts/verify_copyright_headers.ps1 not found. Commit the script to scripts/verify_copyright_headers.ps1 or update the workflow path."
          }

      - name: Verify copyright headers
        run: |
          $failed = $false
          foreach ($pd in @($env:PLUGIN_DIR, $env:VRM_PLUGIN_DIR)) {
            ./scripts/verify_copyright_headers.ps1 -PluginDir $pd -Holder "Lifelike & Believable Animation Design, Inc. | Athomas Goldberg"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Build Fab packages (VMCLiveLink and VRMInterchange)
        run: |
          $OutputDir = "$(Resolve-Path .)\FabBuilds"
          New-Item -ItemType Directory -Path $OutputDir -Force | Out-Null

          # Split env vars into arrays and trim any stray quotes/spaces
          $EngineRoots = ($env:ENGINE_ROOTS -split ",").ForEach({ $_.Trim(' ""') })
          $EngineVers  = ($env:ENGINE_VERSIONS -split ",").ForEach({ $_.Trim(' ""') })

          $PluginDirs = @()
          if ($env:PLUGIN_DIR) { $PluginDirs += $env:PLUGIN_DIR }
          if ($env:VRM_PLUGIN_DIR) { $PluginDirs += $env:VRM_PLUGIN_DIR }

          foreach ($pd in $PluginDirs) {
            Write-Host "Building Fab package for plugin at: $pd"
            ./scripts/build_fab.ps1 -PluginDir $pd -OutputDir $OutputDir -EngineRoots $EngineRoots -EngineVersions $EngineVers
          }

      - name: Get current timestamp
        id: date
        run: echo "timestamp=$(Get-Date -Format 'yyyyMMdd-HHmmss')" >> $env:GITHUB_OUTPUT
        shell: powershell

      # For each engine: a combined zip (both plugins) and one zip per plugin, each named with the
      # engine (for example VMCLiveLink-UE5.7-<timestamp>.zip), from build_fab.ps1's per-engine
      # packages (<Plugin>_UE5_7_Fab.zip).
      - name: Prepare zip files (combined and individual plugins, per engine)
        env:
          TIMESTAMP: ${{ steps.date.outputs.timestamp }}
        run: |
          $OutputDir = "$(Resolve-Path .)\FabBuilds"
          $SourceThirdParty = Join-Path (Resolve-Path .) "$($env:VRM_PLUGIN_DIR)\ThirdParty"
          $EngineVers = ($env:ENGINE_VERSIONS -split ",").ForEach({ $_.Trim(' ""') })

          # Makes $ZipPath from the plugin packages given, each under <ShortEngine>\Plugins\<Plugin>.
          function New-EngineZip($ZipPath, $ShortEngine, $Packages) {
            $Temp = Join-Path $env:TEMP ('fabzip_' + [Guid]::NewGuid().ToString())
            foreach ($Plugin in $Packages.Keys) {
              $Target = Join-Path $Temp "$ShortEngine\Plugins\$Plugin"
              New-Item -ItemType Directory -Path $Target -Force | Out-Null
              Write-Host "  $Plugin <- $($Packages[$Plugin].Name)"
              Expand-Archive -Path $Packages[$Plugin].FullName -DestinationPath $Target -Force
              if ($Plugin -eq 'VRMInterchange') {
                if (-not (Test-Path $SourceThirdParty)) { Write-Error "ThirdParty folder not found at $SourceThirdParty"; exit 1 }
                Copy-Item -Path $SourceThirdParty -Destination (Join-Path $Target 'ThirdParty') -Recurse -Force
              }
            }
            if (Test-Path $ZipPath) { Remove-Item $ZipPath -Force }
            Compress-Archive -Path (Join-Path $Temp '*') -DestinationPath $ZipPath -Force
            Remove-Item -Path $Temp -Recurse -Force
            Write-Host "Made $ZipPath"
          }

          foreach ($Ver in $EngineVers) {
            if ($Ver -notmatch '^(\d+)\.(\d+)') { Write-Error "Engine version '$Ver' isn't <major>.<minor>[.<patch>]"; exit 1 }
            $Major = $matches[1]; $Minor = $matches[2]
            $ShortEngine = "UE$Major.$Minor"
            $Packages = @{}
            foreach ($Plugin in @('VMCLiveLink', 'VRMInterchange')) {
              $Zip = Get-Item -Path (Join-Path $OutputDir "$($Plugin)_UE$($Major)_$($Minor)_Fab.zip") -ErrorAction SilentlyContinue
              if (-not $Zip) { Write-Error "No $Plugin package for UE $Ver in $OutputDir"; exit 1 }
              # The package's descriptor must name its engine (the source descriptors name none).
              Add-Type -AssemblyName System.IO.Compression.FileSystem
              $Archive = [System.IO.Compression.ZipFile]::OpenRead($Zip.FullName)
              try {
                $Entry = $Archive.Entries | Where-Object { $_.FullName -eq "$Plugin.uplugin" } | Select-Object -First 1
                if (-not $Entry) { Write-Error "$($Zip.Name) has no $Plugin.uplugin at its root"; exit 1 }
                $Reader = New-Object System.IO.StreamReader($Entry.Open())
                $Descriptor = $Reader.ReadToEnd()
                $Reader.Dispose()
              } finally {
                $Archive.Dispose()
              }
              if ($Descriptor -notmatch '"EngineVersion"\s*:\s*"([^"]*)"') { Write-Error "$($Zip.Name): no EngineVersion, expected '$Ver'"; exit 1 }
              if ($matches[1] -ne $Ver) { Write-Error "$($Zip.Name): EngineVersion is '$($matches[1])', expected '$Ver'"; exit 1 }
              $Packages[$Plugin] = $Zip
            }
            Write-Host "UE $Ver"
            New-EngineZip (Join-Path $OutputDir "VRMCombined-$ShortEngine-$env:TIMESTAMP.zip") $ShortEngine $Packages
            New-EngineZip (Join-Path $OutputDir "VMCLiveLink-$ShortEngine-$env:TIMESTAMP.zip") $ShortEngine @{ VMCLiveLink = $Packages['VMCLiveLink'] }
            New-EngineZip (Join-Path $OutputDir "VRMInterchange-$ShortEngine-$env:TIMESTAMP.zip") $ShortEngine @{ VRMInterchange = $Packages['VRMInterchange'] }
          }

          $Made = @(Get-ChildItem -Path $OutputDir -Filter "*-UE*-$env:TIMESTAMP.zip" -File)
          $Expected = 3 * $EngineVers.Count
          if ($Made.Count -ne $Expected) { Write-Error "Made $($Made.Count) zips, expected $Expected"; exit 1 }

      - name: Upload artifacts (three zips per engine)
        uses: actions/upload-artifact@v6
        with:
          name: VMCLiveLink-Packages
          path: FabBuilds\*-UE*-${{ steps.date.outputs.timestamp }}.zip
          if-no-files-found: error

      # A release tag publishes every zip to a GitHub Release (REST API; the create-release and
      # upload-release-asset actions are archived). The release is a draft until every zip is up, so
      # a failed upload leaves a draft, not a public release with some of the zips; a re-run of the
      # job makes a new one (the tag includes the attempt).
      - name: Create GitHub Release with the zips
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/release/')
        env:
          TIMESTAMP: ${{ steps.date.outputs.timestamp }}
          TAG: ${{ github.ref_name }}-run${{ github.run_number }}-${{ github.run_attempt }}
          RELEASE_NAME: ${{ github.ref_name }}-${{ steps.date.outputs.timestamp }}
          COMMIT: ${{ github.sha }}
        run: |
          $Headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $Body = @{
            tag_name = $env:TAG
            target_commitish = $env:COMMIT
            name = $env:RELEASE_NAME
            body = "Automated release created by CI for $env:GITHUB_REF_NAME. The run number is included in the release tag for traceability. For each engine ($env:ENGINE_VERSIONS): a combined package (VMCLiveLink + VRMInterchange) and a package per plugin, for Fab submission."
            draft = $true
            prerelease = $false
          } | ConvertTo-Json
          $Release = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases" -Headers $Headers -ContentType 'application/json' -Body $Body
          Write-Host "Created release $($Release.html_url)"
          foreach ($Zip in Get-ChildItem -Path FabBuilds -Filter "*-UE*-$env:TIMESTAMP.zip" -File) {
            $Uri = "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($Release.id)/assets?name=$([Uri]::EscapeDataString($Zip.Name))"
            # The zips are about 140 MB: a long timeout, whatever the default under PowerShell 5.1.
            Invoke-RestMethod -Method Post -Uri $Uri -Headers $Headers -ContentType 'application/zip' -InFile $Zip.FullName -TimeoutSec 1800 | Out-Null
            Write-Host "Uploaded $($Zip.Name)"
          }
          $Published = Invoke-RestMethod -Method Patch -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($Release.id)" -Headers $Headers -ContentType 'application/json' -Body (@{ draft = $false } | ConvertTo-Json)
          Write-Host "Published $($Published.html_url)"
